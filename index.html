<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>195 WG SNCO Evaluation Stratification Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy:      #1a2a5e;
  --navy-dark: #0e1a3d;
  --navy-mid:  #1f3272;
  --navy-lt:   #2a4090;
  --gold:      #f0c030;
  --gold-dk:   #c9960a;
  --gold-lt:   #f8d96a;
  --crimson:   #c0283e;
  --sky:       #6aa3c8;
  --sky-lt:    #9dc4db;
  --ice:       #dde6f5;
  --steel:     #7a93c0;
  --white:     #ffffff;
  --green:     #22c55e;
  --amber:     #f59e0b;
  --card-bg:   #162050;
  --border:    rgba(240,192,48,0.2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--navy-dark);color:var(--ice);min-height:100vh}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(240,192,48,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(240,192,48,.03) 1px,transparent 1px);
  background-size:48px 48px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}

/* HEADER */
header{background:linear-gradient(160deg,var(--navy-mid),var(--navy-dark));border-bottom:3px solid var(--gold);
  padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:90px;position:relative;overflow:hidden}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hdr-left{display:flex;align-items:center;gap:18px;padding:14px 0}
.emblem-wrap{width:72px;height:72px;flex-shrink:0;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
.emblem-wrap img{width:100%;height:100%;object-fit:contain}
.hdr-text .eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:3px;
  text-transform:uppercase;color:var(--gold);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.hdr-text .eyebrow::before,.hdr-text .eyebrow::after{content:'';width:20px;height:1px;background:var(--gold-dk)}
.hdr-text h1{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase;color:var(--white);line-height:1.1}
.hdr-text h1 em{color:var(--gold);font-style:normal}
.hdr-text .sub{font-size:11px;color:var(--steel);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.data-controls{display:flex;flex-direction:column;align-items:flex-end;gap:8px;align-self:center;min-width:260px}
.upload-wrap{display:flex;flex-direction:column;gap:6px;width:100%}
.upload-wrap label.upload-btn{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;background:var(--gold);color:var(--navy-dark);
  border:none;border-radius:5px;padding:10px 20px;cursor:pointer;transition:.2s;
  text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.upload-wrap label.upload-btn:hover{background:var(--gold-lt)}
.load-status{font-size:11px;color:var(--steel);letter-spacing:.5px;text-align:right}
.load-status.ok{color:var(--green)}.load-status.err{color:var(--crimson)}

/* FILTER BAR */
.filter-bar{background:var(--navy-mid);border-bottom:1px solid var(--border);
  padding:10px 32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-bar label{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--gold);
  letter-spacing:2px;text-transform:uppercase;margin-right:4px;flex-shrink:0}
.org-btn{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  background:var(--navy-lt);color:var(--ice);border:1px solid rgba(240,192,48,.2);
  border-radius:4px;padding:5px 12px;cursor:pointer;transition:.15s}
.org-btn:hover{border-color:var(--gold);color:var(--gold)}
.org-btn.active{background:var(--gold);color:var(--navy-dark);border-color:var(--gold)}

/* MAIN */
main{padding:24px 32px;display:flex;flex-direction:column;gap:24px}

/* STAT CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:18px 20px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold)}
.stat-card.green::before{background:var(--green)}
.stat-card.red::before{background:var(--crimson)}
.stat-card.blue::before{background:var(--sky)}
.stat-card .lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--steel);margin-bottom:8px}
.stat-card .val{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:800;color:var(--white);line-height:1}
.stat-card .sub{font-size:12px;color:var(--steel);margin-top:6px}
.stat-card .ratio{font-size:14px;color:var(--gold);font-weight:600;margin-top:4px}

/* RANK CARDS */
.rank-cards{display:flex;gap:14px;flex-wrap:wrap}
.rank-card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;
  padding:18px 22px;flex:1;min-width:220px;position:relative;overflow:hidden}
.rank-card::after{content:attr(data-rank);position:absolute;right:-4px;top:50%;transform:translateY(-50%);
  font-family:'Barlow Condensed',sans-serif;font-size:80px;font-weight:800;
  color:rgba(240,192,48,.04);pointer-events:none;line-height:1}
.rank-card h3{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;
  letter-spacing:1px;color:var(--gold);margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:10px}
.rank-card h3 span{color:var(--ice);font-size:14px;font-weight:400;margin-left:6px}
.rank-row{display:flex;justify-content:space-between;align-items:center;
  padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rank-row:last-child{border-bottom:none}
.rank-row .rl{font-size:12px;color:var(--steel)}
.rval{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700}
.rval.yes{color:var(--green)}.rval.no{color:var(--crimson)}.rval.ratio{color:var(--gold);font-size:16px}

/* SECTION HEADERS */
.sec-hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sec-hdr h2{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--white);white-space:nowrap}
.sec-hdr .line{flex:1;height:1px;background:var(--border)}
.sec-tag{font-size:10px;letter-spacing:1px;text-transform:uppercase;
  background:rgba(240,192,48,.08);color:var(--gold);border:1px solid rgba(240,192,48,.2);
  border-radius:3px;padding:2px 8px;white-space:nowrap}

/* CHART PANELS */
.chart-panel{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:20px}
.chart-panel h3{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;color:var(--sky-lt);margin-bottom:14px}
.chart-wrap{position:relative;width:100%}
.charts-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
thead{background:var(--navy-mid);position:sticky;top:0;z-index:2}
th{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase;
  color:var(--gold);padding:11px 13px;text-align:left;border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none}
th:hover{color:var(--gold-lt)}
th.asc::after{content:' ↑'}th.desc::after{content:' ↓'}
tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .1s}
tbody tr:hover{background:rgba(240,192,48,.05)}
td{padding:10px 13px;color:var(--ice);font-size:14px}
td.num{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;text-align:center}
td.hi{color:var(--gold-lt);font-weight:600}
td.sub-yes{color:var(--green);font-weight:700;text-align:center;font-size:14px}
td.sub-no{color:var(--crimson);text-align:center;font-size:14px}
.rbadge{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  background:rgba(240,192,48,.12);color:var(--gold);border-radius:3px;padding:2px 9px}
.spill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700}
.spill.hi{background:rgba(34,197,94,.15);color:var(--green)}
.spill.md{background:rgba(245,158,11,.15);color:var(--amber)}
.spill.lo{background:rgba(192,40,62,.2);color:var(--crimson)}

/* COLUMN FILTERS (Excel-style) */
th{position:relative}
th .th-inner{display:inline-flex;align-items:center;gap:6px}
th .th-label{cursor:pointer}
.flt-btn{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:3px;background:transparent;border:none;color:var(--steel);cursor:pointer;
  font-size:9px;line-height:1;padding:0;transition:.15s;flex-shrink:0}
.flt-btn:hover{background:rgba(240,192,48,.18);color:var(--gold)}
.flt-btn.active{background:var(--gold);color:var(--navy-dark)}
th.asc::after,th.desc::after{margin-left:2px;font-size:10px}
.flt-pop{position:fixed;z-index:1000;min-width:220px;max-width:300px;
  background:var(--navy);border:1px solid var(--gold);border-radius:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);padding:8px;
  font-family:'Barlow',sans-serif;font-size:12px;color:var(--ice);
  text-transform:none;letter-spacing:normal}
.flt-pop input[type=text]{width:100%;background:var(--navy-dark);border:1px solid var(--border);
  border-radius:3px;padding:5px 7px;color:var(--ice);font-size:12px;font-family:inherit;
  margin-bottom:6px;outline:none}
.flt-pop input[type=text]:focus{border-color:var(--gold)}
.flt-list{max-height:220px;overflow-y:auto;background:var(--navy-dark);
  border:1px solid var(--border);border-radius:3px;padding:4px 6px;margin-bottom:6px}
.flt-item{display:flex;align-items:center;gap:6px;padding:3px 2px;cursor:pointer;
  border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flt-item:hover{background:rgba(240,192,48,.08)}
.flt-item input[type=checkbox]{accent-color:var(--gold);cursor:pointer;flex-shrink:0;margin:0}
.flt-item span{font-size:12px;color:var(--ice);overflow:hidden;text-overflow:ellipsis}
.flt-item.all{border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:3px;font-weight:700}
.flt-actions{display:flex;gap:6px;justify-content:flex-end}
.flt-actions button{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;border-radius:3px;padding:5px 10px;cursor:pointer;
  border:1px solid var(--border);background:var(--navy-mid);color:var(--ice);transition:.15s}
.flt-actions button:hover{border-color:var(--gold);color:var(--gold)}
.flt-actions button.primary{background:var(--gold);color:var(--navy-dark);border-color:var(--gold)}
.flt-actions button.primary:hover{background:var(--gold-lt);color:var(--navy-dark)}
.flt-actions .clear{margin-right:auto}

/* RANK TOGGLE (for Score Distributions) */
.rank-toggle{display:inline-flex;background:var(--navy-mid);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.rank-toggle button{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;background:transparent;color:var(--steel);
  border:none;padding:5px 12px;cursor:pointer;transition:.15s}
.rank-toggle button:hover{color:var(--gold)}
.rank-toggle button.active{background:var(--gold);color:var(--navy-dark)}

/* EMPTY */
.empty{text-align:center;padding:64px 20px;color:var(--steel)}
.empty .ico{font-size:52px;margin-bottom:16px;opacity:.3}
.empty h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--navy-lt);margin-bottom:8px}
.empty p{font-size:13px}

@media(max-width:900px){
  .charts-2col{grid-template-columns:1fr}
  header{flex-direction:column;align-items:flex-start;padding:16px}
  main{padding:16px}.filter-bar{padding:10px 16px}
}
</style>
</head>

    <p>Upload your Microsoft Forms Excel export using the button above to populate the dashboard.</p>
  </div>
</main>

</div>
<script>
// STATE
let allRows = [], currentOrg = 'ALL', sortState = {};
// Column filters: { msgt: { name: Set([...]), ... }, smsgt: { ... } }
// A column key with no entry in colFilters = "all values shown" for that column
let colFilters = { msgt: {}, smsgt: {} };
let scoreDistRank = 'BOTH'; // 'BOTH' | 'MSgt' | 'SMSgt'
const ORGS = ['195 WG HQ','195 ISRG','195 OG','147 CBCS','148 SOPS','149 IS','216 EWS','261 COS','234 IS','222 ISS'];
const EVAL_RECORD_COLS = [
  {key:'experience',  label:'Experience'},
  {key:'education',   label:'Education'},
  {key:'awards',      label:'Awards'},
  {key:'decorations', label:'Decorations'},
  {key:'evalTotal',   label:'Eval of Record Total Score'},
];
const EPB_COLS = [
  {key:'execMission', label:'Executing Mission'},
  {key:'leadPeople',  label:'Leading People'},
  {key:'manageRes',   label:'Managing Resources'},
  {key:'improveUnit', label:'Improving the Unit'},
  {key:'epbTotal',    label:'Current EPB Total Score'},
];
let charts = {};

// DATA SOURCE
const loadStatus = document.getElementById('loadStatus');
const fi         = document.getElementById('fileInput');

function setStatus(msg, type) {
  loadStatus.textContent = msg;
  loadStatus.className = 'load-status' + (type ? ' ' + type : '');
}

fi.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  setStatus('Loading: ' + file.name);
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      processData(XLSX.utils.sheet_to_json(ws, { defval: '' }));
      setStatus('Loaded: ' + file.name, 'ok');
    } catch(err) {
      console.error('File parse failed:', err);
      setStatus('Failed to parse file. Check format.', 'err');
    }
  };
  reader.onerror = () => setStatus('Failed to read file.', 'err');
  reader.readAsArrayBuffer(file);
});

// PROCESS
function processData(raw) {
  const keys = Object.keys(raw[0] || {});
  const execCol    = keys.find(k => k.startsWith('Executing the Mission')) || '';
  const leadCol    = keys.find(k => k.startsWith('Leading People'))        || '';
  const manageCol  = keys.find(k => k.startsWith('Managing Resources'))    || '';
  const improveCol = keys.find(k => k.startsWith('Improving the Unit'))    || '';
  const epbCol     = keys.find(k => k.startsWith('Current EPB'))           || '';

  allRows = raw.map(r => ({
    name:        str(r['Name'] || r['Name2']),
    unit:        str(r['Unit']),
    rank:        normRank(str(r['Rank'])),
    afsc:        str(r['AFSC']),
    dutyTitle:   str(r['Duty Title']),
    tos:         str(r['Time in Service:']),
    dor:         str(r['Date of Rank:']),
    education:   num(r['Education']),
    experience:  num(r['Experience']),
    awards:      num(r['Awards']),
    decorations: num(r['Decorations']),
    evalTotal:   num(r['Evaluation of Record Total Score']),
    execMission: num(r[execCol]),
    leadPeople:  num(r[leadCol]),
    manageRes:   num(r[manageCol]),
    improveUnit: num(r[improveCol]),
    epbTotal:    num(r[epbCol]),
    stratScore:  num(r['Stratification Overall Score']),
    submitStrat: str(r['Submit for Stratification?']).toUpperCase(),
    noReason:    str(r['Provide reason for non-stratification selection']),
    completionTime: fmtCompletion(r['Completion time']),
  })).filter(r => r.name && r.rank && r.unit);

  document.getElementById('filterBar').style.display = 'flex';
  currentOrg = 'ALL'; setActive('ALL');
  colFilters = { msgt: {}, smsgt: {} };
  scoreDistRank = 'BOTH';
  render();
}

function str(v) { return (v == null || v !== v) ? '' : String(v).trim(); }
function num(v) {
  if (v === '' || v == null) return null;
  const n = parseFloat(v); return isNaN(n) ? null : n;
}
function fmtCompletion(v) {
  if (v === '' || v == null) return '';
  // xlsx with cellDates:true gives a Date; otherwise it could be a string
  let d = v instanceof Date ? v : new Date(v);
  if (isNaN(d.getTime())) return String(v).trim();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function normRank(r) {
  const u = r.toUpperCase();
  if (u==='MSGT'||u==='MSG'||u==='E7') return 'MSgt';
  if (u==='SMSGT'||u==='SMSG'||u==='E8') return 'SMSgt';
  return r;
}
function isSubmitted(r) { return r.submitStrat === 'YES'; }

// FILTER
document.getElementById('filterBar').addEventListener('click', e => {
  const b = e.target.closest('.org-btn'); if (!b) return;
  currentOrg = b.dataset.org; setActive(currentOrg);
  colFilters = { msgt: {}, smsgt: {} };
  sortState = {};
  render();
});
function setActive(org) {
  document.querySelectorAll('.org-btn').forEach(b => b.classList.toggle('active', b.dataset.org === org));
}
function rows() { return currentOrg === 'ALL' ? allRows : allRows.filter(r => r.unit === currentOrg); }

// RENDER
function render() {
  Object.values(charts).forEach(c => c.destroy()); charts = {};
  const R = rows(), main = document.getElementById('mainContent');
  if (!allRows.length) { main.innerHTML = '<div class="empty"><div class="ico">[CLIPBOARD]</div><h2>No Data Loaded</h2><p>Upload your Microsoft Forms Excel export to populate the dashboard.</p></div>'; return; }

  const msgt  = R.filter(r => r.rank === 'MSgt');
  const smsgt = R.filter(r => r.rank === 'SMSgt');
  const yesR  = R.filter(isSubmitted);
  const noR   = R.filter(r => !isSubmitted(r));
  const msgtY = msgt.filter(isSubmitted);
  const smsgtY= smsgt.filter(isSubmitted);
  const hasStrat = R.some(r => r.stratScore !== null);
  const orgLabel = currentOrg === 'ALL' ? 'All Organizations' : currentOrg;

  main.innerHTML = `
  <div>
    <div class="sec-hdr"><h2>Summary - ${orgLabel}</h2><div class="line"></div><span class="sec-tag">OVERVIEW</span></div>
    <div class="stat-grid">
      <div class="stat-card"><div class="lbl">Total Submissions</div><div class="val">${R.length}</div><div class="sub">across all ranks</div></div>
      <div class="stat-card green"><div class="lbl">Submitted for Stratification</div><div class="val">${yesR.length}</div><div class="ratio">${yesR.length} / ${R.length} total</div></div>
      <div class="stat-card red"><div class="lbl">Not Submitted</div><div class="val">${noR.length}</div><div class="ratio">${noR.length} / ${R.length} total</div></div>
      <div class="stat-card blue"><div class="lbl">Orgs Represented</div><div class="val">${[...new Set(R.map(r=>r.unit).filter(Boolean))].length}</div><div class="sub">of ${ORGS.length} units</div></div>
    </div>
  </div>

  <div>
    <div class="sec-hdr"><h2>Submissions by Rank</h2><div class="line"></div><span class="sec-tag">RANK DETAIL</span></div>
    <div class="rank-cards">
      ${rankCard('MSgt',msgt,msgtY)}
      ${rankCard('SMSgt',smsgt,smsgtY)}
    </div>
  </div>

  <div>
    <div class="sec-hdr"><h2>Submissions by Organization</h2><div class="line"></div><span class="sec-tag">ORG OVERVIEW</span></div>
    <div class="charts-2col">
      <div class="chart-panel"><h3>Total Submissions per Org</h3><div class="chart-wrap" style="height:260px"><canvas id="cOrgTotal"></canvas></div></div>
      <div class="chart-panel"><h3>Submitted for Stratification per Org</h3><div class="chart-wrap" style="height:260px"><canvas id="cOrgStrat"></canvas></div></div>
    </div>
  </div>

  <div>
    <div class="sec-hdr"><h2>Score Distributions - ${orgLabel}</h2><div class="line"></div>
      <div class="rank-toggle" id="scoreDistToggle">
        <button data-rk="BOTH" class="${scoreDistRank==='BOTH'?'active':''}">Both</button>
        <button data-rk="MSgt" class="${scoreDistRank==='MSgt'?'active':''}">MSgt</button>
        <button data-rk="SMSgt" class="${scoreDistRank==='SMSgt'?'active':''}">SMSgt</button>
      </div>
      <span class="sec-tag">CATEGORIES</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div>
        <div class="sec-hdr" style="margin-bottom:10px"><h2 style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--sky-lt);letter-spacing:1.5px;text-transform:uppercase">Evaluation of Record</h2><div class="line"></div></div>
        <div class="charts-2col" id="catEvalRecord"></div>
      </div>
      <div>
        <div class="sec-hdr" style="margin-bottom:10px"><h2 style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--sky-lt);letter-spacing:1.5px;text-transform:uppercase">Current EPB</h2><div class="line"></div></div>
        <div class="charts-2col" id="catEPB"></div>
      </div>
    </div>
  </div>

  ${hasStrat ? `
  <div>
    <div class="sec-hdr"><h2>Stratification Overall Scores</h2><div class="line"></div><span class="sec-tag">STRAT SCORE</span></div>
    <div class="charts-2col">
      <div class="chart-panel"><h3>MSgt - sorted high to low</h3><div class="chart-wrap" style="height:260px"><canvas id="cStratMSgt"></canvas></div></div>
      <div class="chart-panel"><h3>SMSgt - sorted high to low</h3><div class="chart-wrap" style="height:260px"><canvas id="cStratSMSgt"></canvas></div></div>
    </div>
  </div>` : ''}

  <div style="display:flex;flex-direction:column;gap:20px">
    <div class="sec-hdr"><h2>MSgt Roster</h2><div class="line"></div><span class="sec-tag">SUBMITTED FIRST . SORTED BY STRAT SCORE</span></div>
    <div class="tbl-wrap">${buildTable(msgt,'msgt')}</div>
    <div class="sec-hdr" style="margin-top:8px"><h2>SMSgt Roster</h2><div class="line"></div><span class="sec-tag">SUBMITTED FIRST . SORTED BY STRAT SCORE</span></div>
    <div class="tbl-wrap">${buildTable(smsgt,'smsgt')}</div>
  </div>`;

  buildOrgCharts(R);
  buildCatCharts(R);
  if (hasStrat) buildStratChart(R);
  attachSort();
  attachColFilters();
  attachScoreDistToggle();
}

function attachScoreDistToggle() {
  const tog = document.getElementById('scoreDistToggle');
  if (!tog) return;
  tog.addEventListener('click', e => {
    const b = e.target.closest('button[data-rk]');
    if (!b) return;
    scoreDistRank = b.dataset.rk;
    tog.querySelectorAll('button').forEach(x => x.classList.toggle('active', x.dataset.rk === scoreDistRank));
    // Destroy existing cat charts then rebuild with rank filter
    Object.keys(charts).forEach(k => {
      if (k.startsWith('c_catEvalRecord_') || k.startsWith('c_catEPB_')) {
        charts[k].destroy();
        delete charts[k];
      }
    });
    buildCatCharts(rows());
  });
}

function rankCard(label, rk, sub) {
  const t=rk.length, y=sub.length, n=t-y, pct=t?Math.round(y/t*100):0;
  return `<div class="rank-card" data-rank="${label}">
    <h3>${label}<span>(${t} total)</span></h3>
    <div class="rank-row"><span class="rl">Submitted for Stratification</span><span class="rval yes">${y}/${t}</span></div>
    <div class="rank-row"><span class="rl">Not Submitted</span><span class="rval no">${n}/${t}</span></div>
    <div class="rank-row"><span class="rl">Submission Rate</span><span class="rval ratio">${pct}%</span></div>
  </div>`;
}

// CHART DEFAULTS
const CD = {
  plugins:{legend:{display:false},tooltip:{backgroundColor:'#1a2a5e',titleColor:'#f0c030',bodyColor:'#dde6f5',borderColor:'#f0c030',borderWidth:1}},
  scales:{
    x:{ticks:{color:'#9dc4db',font:{family:'Barlow Condensed',size:13,weight:'600'}},grid:{color:'rgba(255,255,255,.04)'}},
    y:{ticks:{color:'#9dc4db',font:{family:'Barlow Condensed',size:13,weight:'600'}},grid:{color:'rgba(255,255,255,.04)'},beginAtZero:true}
  },
  maintainAspectRatio:false
};

function buildOrgCharts(R) {
  const tot={}, sub={};
  ORGS.forEach(o=>{tot[o]=0;sub[o]=0;});
  R.forEach(r=>{if(tot[r.unit]!==undefined){tot[r.unit]++;if(isSubmitted(r))sub[r.unit]++;}});
  const mk=(data,color)=>({type:'bar',data:{labels:ORGS,datasets:[{data,backgroundColor:color,borderRadius:4}]},options:{...CD}});
  charts['ot']=new Chart(document.getElementById('cOrgTotal'),mk(ORGS.map(o=>tot[o]),'rgba(240,192,48,.72)'));
  charts['os']=new Chart(document.getElementById('cOrgStrat'),mk(ORGS.map(o=>sub[o]),'rgba(106,163,200,.72)'));
}

function makeHistChart(containerId, cols, R) {
  const c = document.getElementById(containerId); c.innerHTML='';
  cols.forEach(({key,label})=>{
    const vals=R.map(r=>r[key]).filter(v=>v!==null);
    if(!vals.length)return;
    const bk={};
    vals.forEach(v=>{const k=Math.round(v);bk[k]=(bk[k]||0)+1;});
    const labs=Object.keys(bk).sort((a,b)=>a-b);
    const avg=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
    const div=document.createElement('div');
    div.className='chart-panel';
    div.innerHTML='<h3>'+label+'<span style="color:var(--steel);font-size:10px;margin-left:8px">(avg: '+avg+')</span></h3><div class="chart-wrap" style="height:200px"><canvas id="c_'+containerId+'_'+key+'"></canvas></div>';
    c.appendChild(div);
    charts['c_'+containerId+'_'+key]=new Chart(div.querySelector('canvas'),{
      type:'bar',
      data:{labels:labs,datasets:[{data:labs.map(l=>bk[l]),backgroundColor:'rgba(240,192,48,.68)',borderRadius:3,hoverBackgroundColor:'rgba(248,217,106,.9)'}]},
      options:{...CD,plugins:{...CD.plugins,tooltip:{...CD.plugins.tooltip,callbacks:{title:i=>'Score: '+i[0].label,label:i=>i.raw+' member'+(i.raw!==1?'s':'')}}}}
    });
  });
}

function buildCatCharts(R) {
  const filtered = scoreDistRank === 'BOTH' ? R : R.filter(r => r.rank === scoreDistRank);
  makeHistChart('catEvalRecord', EVAL_RECORD_COLS, filtered);
  makeHistChart('catEPB', EPB_COLS, filtered);
}

function buildStratChart(R) {
  const mkStratChart = (canvasId, rankRows) => {
    const sr=rankRows.filter(r=>r.stratScore!==null).sort((a,b)=>b.stratScore-a.stratScore);
    if(!sr.length)return;
    charts[canvasId]=new Chart(document.getElementById(canvasId),{
      type:'bar',
      data:{labels:sr.map(r=>r.name),datasets:[{data:sr.map(r=>r.stratScore),
        backgroundColor:'rgba(240,192,48,.72)',
        borderRadius:4}]},
      options:{...CD,plugins:{...CD.plugins,tooltip:{...CD.plugins.tooltip,callbacks:{label:i=>'Strat Score: '+i.raw}}}}
    });
  };
  mkStratChart('cStratMSgt',  R.filter(r=>r.rank==='MSgt'));
  mkStratChart('cStratSMSgt', R.filter(r=>r.rank==='SMSgt'));
}

// TABLE
// Format a cell value for filter dropdown display (must match what a user sees / understands)
function fmtFilterVal(col, r) {
  const v = r[col];
  if (col === 'submitStrat') return isSubmitted(r) ? 'YES' : 'NO';
  if (v === null || v === undefined || v === '') return '(blank)';
  return String(v);
}

// Get unique values for a column, from the BASE roster of that table (pre-filter)
function uniqueColVals(rk, col) {
  const seen = new Map();
  rk.forEach(r => {
    const v = fmtFilterVal(col, r);
    if (!seen.has(v)) seen.set(v, true);
  });
  const arr = [...seen.keys()];
  // Numeric-aware sort, blanks last
  arr.sort((a, b) => {
    if (a === '(blank)') return 1;
    if (b === '(blank)') return -1;
    const an = parseFloat(a), bn = parseFloat(b);
    if (!isNaN(an) && !isNaN(bn)) return an - bn;
    return a.localeCompare(b);
  });
  return arr;
}

// Apply active column filters for a given table
function applyColFilters(rk, tid) {
  const f = colFilters[tid] || {};
  const cols = Object.keys(f);
  if (!cols.length) return rk;
  return rk.filter(r => cols.every(col => f[col].has(fmtFilterVal(col, r))));
}

function buildTable(rk, tid) {
  const filtered = applyColFilters(rk, tid);
  const sorted=[...filtered].sort((a,b)=>{
    const as=isSubmitted(a)?1:0, bs=isSubmitted(b)?1:0;
    if(bs!==as) return bs-as;
    return (b.stratScore||0)-(a.stratScore||0);
  });
  const cols=[
    {k:'name',l:'Name'},{k:'rank',l:'Rank'},{k:'unit',l:'Unit'},{k:'afsc',l:'AFSC'},
    {k:'experience',l:'Exp'},{k:'education',l:'Edu'},{k:'awards',l:'Awards'},{k:'decorations',l:'Decs'},
    {k:'evalTotal',l:'Eval Total'},{k:'execMission',l:'Exec Mission'},{k:'leadPeople',l:'Lead People'},
    {k:'manageRes',l:'Res Mgmt'},{k:'improveUnit',l:'Improve Unit'},{k:'epbTotal',l:'EPB Total'},
    {k:'submitStrat',l:'Submitted'},{k:'stratScore',l:'Strat Score'},
    {k:'completionTime',l:'Completion Time'},
  ];
  const thead=`<thead><tr>${cols.map(c=>{
    const isActive = colFilters[tid] && colFilters[tid][c.k];
    return `<th data-tid="${tid}" data-col="${c.k}"><span class="th-inner">`+
      `<span class="th-label">${c.l}</span>`+
      `<button class="flt-btn${isActive?' active':''}" data-flt-tid="${tid}" data-flt-col="${c.k}" title="Filter">▼</button>`+
      `</span></th>`;
  }).join('')}</tr></thead>`;
  const tbody=`<tbody>${sorted.map(r=>`<tr>${cols.map(c=>{
    const v=r[c.k];
    if(c.k==='name') return `<td class="hi">${v||'-'}</td>`;
    if(c.k==='rank') return `<td><span class="rbadge">${v||'-'}</span></td>`;
    if(c.k==='unit'||c.k==='afsc') return `<td>${v||'-'}</td>`;
    if(c.k==='submitStrat') return isSubmitted(r)?`<td class="sub-yes">YES</td>`:`<td class="sub-no">NO</td>`;
    if(c.k==='stratScore'){
      if(v===null) return `<td class="num" style="color:var(--steel)">-</td>`;
      const cls=v>=25?'hi':v>=18?'md':'lo';
      return `<td class="num"><span class="spill ${cls}">${v}</span></td>`;
    }
    if(c.k==='completionTime') return `<td style="font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--steel);white-space:nowrap">${v||'-'}</td>`;
    return `<td class="num">${v!==null?v:'-'}</td>`;
  }).join('')}</tr>`).join('')}</tbody>`;
  return `<table id="t_${tid}" data-tid="${tid}">${thead}${tbody}</table>`;
}

function attachSort() {
  document.querySelectorAll('th[data-tid]').forEach(th=>{
    const lbl = th.querySelector('.th-label');
    if (!lbl) return;
    lbl.addEventListener('click',()=>{
      const tid=th.dataset.tid, col=th.dataset.col, key=`${tid}_${col}`;
      const dir=(sortState[key]||'none')==='asc'?'desc':'asc';
      sortState={}; sortState[key]=dir;
      const tbl=document.getElementById(`t_${tid}`);
      const trs=[...tbl.querySelectorAll('tbody tr')];
      const idx=[...th.parentElement.children].indexOf(th);
      trs.sort((a,b)=>{
        const av=a.cells[idx].textContent.trim(), bv=b.cells[idx].textContent.trim();
        const an=parseFloat(av.replace(/[^0-9.\-]/g,'')), bn=parseFloat(bv.replace(/[^0-9.\-]/g,''));
        const cmp=(!isNaN(an)&&!isNaN(bn))?an-bn:av.localeCompare(bv);
        return dir==='asc'?cmp:-cmp;
      });
      tbl.querySelectorAll('th').forEach(h=>h.classList.remove('asc','desc'));
      th.classList.add(dir);
      const tb=tbl.querySelector('tbody'); trs.forEach(r=>tb.appendChild(r));
    });
  });
}

// COLUMN FILTERS (Excel-style)
function attachColFilters() {
  document.querySelectorAll('.flt-btn[data-flt-tid]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openFilterPopup(btn);
    });
  });
}

function closeFilterPopup() {
  const ex = document.getElementById('fltPop');
  if (ex) ex.remove();
  document.removeEventListener('mousedown', _fltOutside, true);
  document.removeEventListener('keydown', _fltKey, true);
}

function _fltOutside(e) {
  const pop = document.getElementById('fltPop');
  if (!pop) return;
  if (!pop.contains(e.target) && !e.target.classList.contains('flt-btn')) {
    closeFilterPopup();
  }
}
function _fltKey(e) {
  if (e.key === 'Escape') closeFilterPopup();
}

function openFilterPopup(btn) {
  closeFilterPopup();
  const tid = btn.dataset.fltTid, col = btn.dataset.fltCol;
  // Base roster for this table (filtered by current Org, but pre-column-filters)
  const R = rows();
  const rk = tid === 'msgt' ? R.filter(r => r.rank === 'MSgt') : R.filter(r => r.rank === 'SMSgt');
  const allVals = uniqueColVals(rk, col);
  // Currently selected set: if no filter active, all values are "selected"
  const cur = colFilters[tid][col] ? new Set(colFilters[tid][col]) : new Set(allVals);

  const pop = document.createElement('div');
  pop.className = 'flt-pop';
  pop.id = 'fltPop';
  pop.innerHTML = `
    <input type="text" placeholder="Search..." id="fltSearch" autocomplete="off">
    <div class="flt-list" id="fltList">
      <label class="flt-item all"><input type="checkbox" id="fltAll"><span>(Select All)</span></label>
      ${allVals.map((v,i) => `
        <label class="flt-item" data-val="${escAttr(v)}">
          <input type="checkbox" class="fltCb" data-val="${escAttr(v)}" ${cur.has(v)?'checked':''}>
          <span title="${escAttr(v)}">${escHtml(v)}</span>
        </label>`).join('')}
    </div>
    <div class="flt-actions">
      <button class="clear" id="fltClear">Clear</button>
      <button id="fltCancel">Cancel</button>
      <button class="primary" id="fltOk">OK</button>
    </div>`;
  document.body.appendChild(pop);

  // Position the popup below the button, clamped to viewport
  const r = btn.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left;
  let top = r.bottom + 4;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  if (left < 8) left = 8;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 4);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';

  const list = pop.querySelector('#fltList');
  const allCb = pop.querySelector('#fltAll');
  const search = pop.querySelector('#fltSearch');

  function syncAllCb() {
    const visibleCbs = [...list.querySelectorAll('.fltCb')].filter(cb =>
      cb.closest('.flt-item').style.display !== 'none');
    if (!visibleCbs.length) { allCb.checked = false; allCb.indeterminate = false; return; }
    const checked = visibleCbs.filter(cb => cb.checked).length;
    allCb.indeterminate = checked > 0 && checked < visibleCbs.length;
    allCb.checked = checked === visibleCbs.length;
  }
  syncAllCb();

  allCb.addEventListener('change', () => {
    const visibleCbs = [...list.querySelectorAll('.fltCb')].filter(cb =>
      cb.closest('.flt-item').style.display !== 'none');
    visibleCbs.forEach(cb => cb.checked = allCb.checked);
    allCb.indeterminate = false;
  });
  list.addEventListener('change', e => {
    if (e.target.classList.contains('fltCb')) syncAllCb();
  });
  search.addEventListener('input', () => {
    const q = search.value.toLowerCase();
    list.querySelectorAll('.flt-item[data-val]').forEach(it => {
      const v = it.dataset.val.toLowerCase();
      it.style.display = v.includes(q) ? '' : 'none';
    });
    syncAllCb();
  });
  search.focus();

  pop.querySelector('#fltClear').addEventListener('click', () => {
    delete colFilters[tid][col];
    closeFilterPopup();
    rerenderTable(tid);
  });
  pop.querySelector('#fltCancel').addEventListener('click', closeFilterPopup);
  pop.querySelector('#fltOk').addEventListener('click', () => {
    const checkedVals = [...list.querySelectorAll('.fltCb:checked')].map(cb => cb.dataset.val);
    if (checkedVals.length === allVals.length) {
      // All selected = no filter
      delete colFilters[tid][col];
    } else {
      colFilters[tid][col] = new Set(checkedVals);
    }
    closeFilterPopup();
    rerenderTable(tid);
  });

  setTimeout(() => {
    document.addEventListener('mousedown', _fltOutside, true);
    document.addEventListener('keydown', _fltKey, true);
  }, 0);
}

function rerenderTable(tid) {
  const R = rows();
  const rk = tid === 'msgt' ? R.filter(r => r.rank === 'MSgt') : R.filter(r => r.rank === 'SMSgt');
  const tbl = document.getElementById(`t_${tid}`);
  if (!tbl) return;
  const wrap = tbl.parentElement;
  wrap.innerHTML = buildTable(rk, tid);
  attachSort();
  attachColFilters();
}

function escHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return escHtml(s); }
</script>
</body>
